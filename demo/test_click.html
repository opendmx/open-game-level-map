<!DOCTYPE html>
<html>
<head>
    <title>Test Level Click</title>
</head>
<body>
    <h1>Test Level Click</h1>
    <game-level-map id="test" levels="5" current-level="3" completed-levels="1,2"></game-level-map>
    
    <div id="output" style="margin-top: 20px; padding: 20px; border: 2px solid black; background: #f0f0f0;">
        <h2>Click Events:</h2>
        <div id="events"></div>
    </div>
    
    <script src="../src/game-level-map.js"></script>
    <script>
        const levelMap = document.getElementById('test');
        const eventsDiv = document.getElementById('events');
        
        levelMap.addEventListener('level-click', (event) => {
            const { level, state, config } = event.detail;
            const entry = document.createElement('div');
            entry.style.padding = '5px';
            entry.style.marginBottom = '5px';
            entry.style.background = 'white';
            entry.textContent = `Level ${level} clicked - State: ${state}`;
            eventsDiv.appendChild(entry);
            console.log('Level clicked:', event.detail);
        });
    </script>
</body>
</html>
